{% extends "base.html" %}

{% block title %}Login Cancelled — SOLE DROP{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <div style="font-size:3rem;margin-bottom:16px">🔒</div>
    <h2 class="auth-title">Login Cancelled</h2>
    <p class="auth-sub">You cancelled the Google sign-in. No worries — you can try again anytime.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:28px">
      <a href="{% url 'accounts:login' %}" class="btn-primary">Try Again</a>
      <a href="{% url 'products:home' %}" class="btn-ghost">Continue Browsing</a>
    </div>
  </div>
</div>
{% endblock %}
